name: PhoneFold
options:
  bundleIdPrefix: com.mdeller
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true

# The team id is never written into this repository: XcodeGen expands the environment
# variable, which is sourced from the credentials file outside the repo.
settings:
  base:
    DEVELOPMENT_TEAM: ${APPLE_TEAM_ID}
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"

packages:
  PhoneFoldKit:
    path: ../../PhoneFoldKit

targets:
  PhoneFold:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
      # The Genie 2 step model. Xcode compiles the .mlpackage to a .mlmodelc in the bundle,
      # which is what Genie2Sampler.bundled() looks for.
      - path: ../../Models/Genie2Step_L64.mlpackage
        buildPhase: resources
      # The style profiles, referenced where PLAN.md puts them rather than copied into this
      # target. A folder reference, so the bundle keeps the Styles/ directory and every app
      # reads the same files - a copy here would be free to drift from the canonical one
      # with nothing to notice it had.
      - path: ../Shared/Resources/Styles
        buildPhase: resources
        type: folder
      # The gallery's listening notes, referenced where they live rather than copied, for the
      # same reason as the styles: a second copy is free to drift.
      - path: ../Shared/Resources/Notes
        buildPhase: resources
        type: folder
    dependencies:
      - package: PhoneFoldKit
        products: [FoldCore, FoldGeometry, FoldEngine, FoldRender, FoldAudio, FoldCapture]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: PhoneFold
        CFBundleShortVersionString: $(MARKETING_VERSION)
        UILaunchScreen: {}
        # Add-only, which is the narrowest thing that works: PhoneFold writes films and never
        # reads the library, and asking for full access to do that would be asking for more
        # than the feature needs.
        NSPhotoLibraryAddUsageDescription: >-
          PhoneFold saves the film of a fold, with its music, to your photo library.
        NSHumanReadableCopyright: "2026 Marc C. Deller"
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mdeller.phonefold
        # macOS only. `com.apple.security.app-sandbox` is not a valid iOS entitlement - iOS
        # sandboxes every app implicitly - and supplying it there is a provisioning error
        # rather than a no-op, so the setting is conditioned on the SDK.
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": PhoneFold-macOS.entitlements
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
