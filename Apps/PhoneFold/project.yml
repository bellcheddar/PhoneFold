name: PhoneFold
options:
  bundleIdPrefix: com.mdeller
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
    watchOS: "11.0"
    visionOS: "2.0"
  createIntermediateGroups: true

# The team id is never written into this repository: XcodeGen expands the environment
# variable, which is sourced from the credentials file outside the repo.
settings:
  base:
    DEVELOPMENT_TEAM: ${APPLE_TEAM_ID}
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"

packages:
  PhoneFoldKit:
    path: ../../PhoneFoldKit

targets:
  PhoneFold:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Sources
      # P4-16, the app icon: a real frame of a real fold, rendered by `make-icon` from the
      # trp-cage demo structure in the app's own secondary-structure colouring.
      - path: Assets.xcassets
        buildPhase: resources
      # The Live Activity's state type, compiled into the app and the widget extension from
      # the same file. See FoldActivityAttributes.swift for why it is not duplicated.
      - path: ../Shared/Sources
      - path: Resources
        buildPhase: resources
      # The Genie 2 step model. Xcode compiles the .mlpackage to a .mlmodelc in the bundle,
      # which is what Genie2Sampler.bundled() looks for.
      - path: ../../Models/Genie2Step_L64.mlpackage
        buildPhase: resources
      # The style profiles, referenced where PLAN.md puts them rather than copied into this
      # target. A folder reference, so the bundle keeps the Styles/ directory and every app
      # reads the same files - a copy here would be free to drift from the canonical one
      # with nothing to notice it had.
      - path: ../Shared/Resources/Styles
        buildPhase: resources
        type: folder
      # The gallery's listening notes, referenced where they live rather than copied, for the
      # same reason as the styles: a second copy is free to drift.
      - path: ../Shared/Resources/Notes
        buildPhase: resources
        type: folder
    dependencies:
      - package: PhoneFoldKit
        products: [FoldCore, FoldGeometry, FoldEngine, FoldRender, FoldAudio, FoldCapture,
                   FoldSync]
      # iOS only, and filtered rather than conditioned: PhoneFold is one target for two
      # platforms, and a macOS build that tries to embed an iOS app extension fails outright.
      - target: PhoneFoldWidgets
        destinationFilters: [iOS]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: PhoneFold
        CFBundleShortVersionString: $(MARKETING_VERSION)
        # **Written by hand, because XcodeGen supplies the Info.plist.** Xcode injects
        # CFBundleIconName only when it is generating the plist itself (GENERATE_INFOPLIST_FILE),
        # and an explicit plist gets no such favour. Without it the asset catalogue still
        # compiles, the icon still appears on the home screen, and App Store Connect refuses the
        # upload: "A value for the Info.plist key CFBundleIconName is missing." It was missing on
        # iOS, watchOS and visionOS and present on macOS, which is exactly the kind of asymmetry
        # nobody checks.
        CFBundleIconName: AppIcon
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        # Handoff. Both apps must declare the same type or the continuation never arrives,
        # and there is no error anywhere when they do not.
        NSUserActivityTypes:
          - com.mdeller.phonefold.fold
        # Required for the external display scene to be delivered at all: a scene role other
        # than the application role is only offered to an app that declares it supports more
        # than one. On iPad this also permits a second app window, which shows the same fold
        # because the fold lives above the scene rather than inside it.
        UIApplicationSceneManifest:
          # `UIApplicationSupportsMultipleScenes` alone is not enough, and this was measured:
          # with only that key the system created exactly one scene, the external screen
          # reported no surfaces, and nothing appeared on it. The role has to be *declared*
          # before iOS will offer a scene for it - the app delegate's routing is consulted
          # only for a scene the system has already decided to create.
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            UIWindowSceneSessionRoleExternalDisplayNonInteractive:
              - UISceneConfigurationName: External Display
                UISceneDelegateClassName: ExternalDisplaySceneDelegate
        # Add-only, which is the narrowest thing that works: PhoneFold writes films and never
        # reads the library, and asking for full access to do that would be asking for more
        # than the feature needs.
        NSPhotoLibraryAddUsageDescription: >-
          PhoneFold saves the film of a fold, with its music, to your photo library.
        NSHumanReadableCopyright: "2026 Marc C. Deller"
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mdeller.phonefold
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # macOS only. `com.apple.security.app-sandbox` is not a valid iOS entitlement - iOS
        # sandboxes every app implicitly - and supplying it there is a provisioning error
        # rather than a no-op, so the setting is conditioned on the SDK.
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": PhoneFold-macOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": PhoneFold-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": PhoneFold-iOS.entitlements
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic

  # The Live Activity's UI. A widget extension is not optional for this feature: ActivityKit
  # renders the Lock Screen banner and the Dynamic Island out of process, and without an
  # extension `areActivitiesEnabled` is false and every request throws.
  PhoneFoldWidgets:
    type: app-extension
    supportedDestinations: [iOS]
    sources:
      - path: Widgets
      - path: ../Shared/Sources
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      # For FoldActivitySnapshot, which the extension decodes and the app encodes. One
      # definition of the wire format, not two.
      - package: PhoneFoldKit
        products: [FoldCore]
    info:
      path: PhoneFoldWidgets-Info.plist
      properties:
        CFBundleDisplayName: PhoneFold
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mdeller.phonefold.widgets
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES

  # PLAN.md Phase 5a. Native macOS, not Catalyst, and the same stage as the phone rather than a
  # fork of it: this target compiles Apps/PhoneFold/Sources with its own @main.
  PhoneFoldStudio:
    type: application
    supportedDestinations: [macOS]
    sources:
      - path: Sources
        # PhoneFoldApp.swift carries the phone's @main. Two of those in one target is a link
        # error, and the Studio's own entry point is in its own directory.
        excludes:
          - PhoneFoldApp.swift
      - path: ../PhoneFoldStudio-macOS/Sources
      - path: Assets.xcassets
        buildPhase: resources
      - path: ../Shared/Sources
      - path: Resources
        buildPhase: resources
      # PLAN.md Phase 5a: "Studio raises the cap; the phone does not." Three length buckets
      # here against the phone's one - 34, 37 and 51 MB - because a Mac can spare 122 MB of
      # bundle and the minutes a 256-residue trajectory takes, and a phone can spare neither.
      # `Genie2Sampler.bundledLengths` probes for these rather than being told, so nothing has
      # to know which app it is compiled into.
      - path: ../../Models/Genie2Step_L64.mlpackage
        buildPhase: resources
      - path: ../../Models/Genie2Step_L128.mlpackage
        buildPhase: resources
      - path: ../../Models/Genie2Step_L256.mlpackage
        buildPhase: resources
      - path: ../Shared/Resources/Styles
        buildPhase: resources
        type: folder
      - path: ../Shared/Resources/Notes
        buildPhase: resources
        type: folder
    dependencies:
      - package: PhoneFoldKit
        products: [FoldCore, FoldGeometry, FoldEngine, FoldRender, FoldAudio, FoldCapture,
                   FoldSync]
    info:
      path: PhoneFoldStudio-Info.plist
      properties:
        CFBundleDisplayName: PhoneFold Studio
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleIconName: AppIcon
        NSHumanReadableCopyright: "2026 Marc C. Deller"
        ITSAppUsesNonExemptEncryption: false
        NSUserActivityTypes:
          - com.mdeller.phonefold.fold
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mdeller.phonefold.studio
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: PhoneFold-macOS.entitlements
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic

  # PLAN.md Phase 5b. A single-target watchOS app (WKApplication), embedded in the phone app so
  # it installs with it. Memory: a companion watch app must be embedded, not merely depended on.
  PhoneFoldWatch:
    type: application
    # `platform`, not `supportedDestinations`: XcodeGen refuses watchOS in a multiplatform
    # target, because a watch app is its own product rather than another destination.
    platform: watchOS
    sources:
      - path: ../PhoneFold-watchOS/Sources
      - path: ../PhoneFold-watchOS/Assets.xcassets
        buildPhase: resources
      # The Watch app is its own binary and Apple wants a manifest per binary, not per app.
      # It reaches the same app group the phone writes, so it declares the same two reasons.
      - path: ../PhoneFold-watchOS/PrivacyInfo.xcprivacy
        buildPhase: resources
      # The Fold of the Day, baked by Tools/make_fold_of_the_day.py. 228 kB for six folds of
      # ninety frames, which is the whole reason the wrist needs no engine and no phone.
      - path: ../PhoneFold-watchOS/Resources
        buildPhase: resources
    dependencies:
      # FoldSync and FoldCore. Not FoldAudio and not FoldRender: the Watch runs no audio and
      # draws no protein from a mesh, and the style and colour lists arrive from the phone in
      # the state it publishes. FoldCore is here for `DailyFoldLibrary` - the daily fold's
      # decoder and its day picker, which are value types with tests and no business living in
      # a watch app.
      - package: PhoneFoldKit
        products: [FoldSync, FoldCore]
      - target: PhoneFoldWatchWidgets
    info:
      path: PhoneFoldWatch-Info.plist
      properties:
        CFBundleDisplayName: PhoneFold
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleIconName: AppIcon
        # The modern single-target watch app. Without this it is treated as a legacy
        # WatchKit extension pair and will not launch.
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.mdeller.phonefold
        NSHumanReadableCopyright: "2026 Marc C. Deller"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mdeller.phonefold.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: PhoneFoldWatch.entitlements
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES

  # PLAN.md Phase 5b's complication. The identifier ends `.widget`: `.complication` is reserved
  # in Apple's App ID namespace and is rejected at any depth, with an error naming the
  # identifier rather than the reason.
  PhoneFoldWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: ../PhoneFold-watchOS/Widgets
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - package: PhoneFoldKit
        products: [FoldSync]
    info:
      path: PhoneFoldWatchWidgets-Info.plist
      properties:
        CFBundleDisplayName: PhoneFold
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mdeller.phonefold.watchkitapp.widget
        CODE_SIGN_ENTITLEMENTS: PhoneFoldWatch.entitlements
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES

  # PLAN.md Phase 5c. Compiles the phone's own stage with its own entry point, exactly as
  # PhoneFold Studio does, so FoldCanvas and FoldPlayer have one definition across five surfaces.
  PhoneFoldVision:
    type: application
    platform: visionOS
    sources:
      - path: Sources
        excludes:
          - PhoneFoldApp.swift
          # RealityKit on visionOS has no CustomMaterial and permits no custom Metal surface
          # shaders, so this would not compile and nothing there would use it.
          - StageShaders.metal
      - path: ../PhoneFold-visionOS/Sources
      - path: ../PhoneFold-visionOS/Assets.xcassets
        buildPhase: resources
      - path: ../Shared/Sources
      - path: Resources
        buildPhase: resources
      - path: ../../Models/Genie2Step_L64.mlpackage
        buildPhase: resources
      - path: ../Shared/Resources/Styles
        buildPhase: resources
        type: folder
      - path: ../Shared/Resources/Notes
        buildPhase: resources
        type: folder
    dependencies:
      - package: PhoneFoldKit
        products: [FoldCore, FoldGeometry, FoldEngine, FoldRender, FoldAudio, FoldCapture,
                   FoldSync]
    info:
      path: PhoneFoldVision-Info.plist
      properties:
        CFBundleDisplayName: PhoneFold
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleIconName: AppIcon
        NSHumanReadableCopyright: "2026 Marc C. Deller"
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
    settings:
      base:
        # **The same identifier as iPhone and iPad, deliberately.** Marc's call, 2026-09-01:
        # one App Store listing rather than two, so PhoneFold is one product with a Vision Pro
        # version rather than two apps with the same name - one price, one page, and universal
        # purchase, so somebody who has it on their phone has it on the headset.
        #
        # A different identifier per platform is what splits them, and it is easy to reach for
        # because the visionOS target genuinely ships different resources. It does not need to:
        # a bundle id spans platforms and the resources are per target regardless.
        PRODUCT_BUNDLE_IDENTIFIER: com.mdeller.phonefold
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: PhoneFold-iOS.entitlements
        CODE_SIGN_STYLE: Automatic

# PLAN.md's cross-platform gate: "all five apps build in one `xcodebuild` invocation".
#
# **One scheme with every target, and `xcodebuild` given four destinations at once.** A single
# destination cannot do it - the five apps are three products on four platforms - but xcodebuild
# takes repeated `-destination` flags and builds the scheme for each, which is one invocation by
# any reading. See Tools/verify_phase.sh.
# **Declaring any scheme stops XcodeGen generating them for every target.** Adding
# `PhoneFoldAll` silently removed the `PhoneFold` scheme, which the phase 4 gate builds by
# name - so phase 4's gate would have failed with "does not contain a scheme named PhoneFold"
# on a tree where nothing about phase 4 had changed. The other three survived because a target
# with its own `platform:` still gets one. Every scheme the project needs is therefore named
# here, explicitly, rather than relying on a rule with exceptions in it.
schemes:
  PhoneFold:
    build:
      targets:
        PhoneFold: [run, test, profile, analyze, archive]
        PhoneFoldWidgets: [run, test, profile, analyze, archive]

  PhoneFoldAll:
    build:
      targets:
        PhoneFold: [run, test, profile, analyze, archive]
        PhoneFoldWidgets: [run, test, profile, analyze, archive]
        PhoneFoldStudio: [run, test, profile, analyze, archive]
        PhoneFoldWatch: [run, test, profile, analyze, archive]
        PhoneFoldWatchWidgets: [run, test, profile, analyze, archive]
        PhoneFoldVision: [run, test, profile, analyze, archive]
